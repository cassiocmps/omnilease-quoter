<div class="app-container">
  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="brand-bar">
      <div class="brand-logo">
        <span class="logo-badge">OL</span>
        <div>
          <h1 class="brand-title">OmniLease <span class="brand-subtitle">Quoter</span></h1>
          <p class="brand-tagline">Plataforma Multi-Seguradora de Fiança Locatícia</p>
        </div>
      </div>

      <div class="milestone-pill">
        <span class="pulse-dot"></span>
        <span>Milestone 6: Modern Routing &amp; Functional Guards</span>
      </div>
    </div>

    <!-- Navigation Tabs (Milestone 6) -->
    <nav class="app-nav" aria-label="Navegação Principal">
      <div class="nav-links">
        <a
          routerLink="/quoter"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-tab"
        >
          1. Formulário de Cotação
        </a>

        <a
          routerLink="/results"
          routerLinkActive="active"
          class="nav-tab"
          [class.disabled]="!quoteState.hasActiveQuotes()"
        >
          2. Comparativo de Propostas
          @if (quoteState.hasActiveQuotes()) {
            <span class="count-badge">{{ quoteState.quotes().length }}</span>
          }
        </a>
      </div>
    </nav>
  </header>

  <!-- Main Routing Container with Lazy-Loaded Route Outlet -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
